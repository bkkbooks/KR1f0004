body:
  text: 孝經注疏卷二唐明皇御注陸德明音義宋邢昺疏諸侯章第三疏正義曰次天子之貴者諸侯也案釋詁云公侯君也不曰諸公者嫌涉天子三公也故以其次稱為諸侯猶言諸國之君也皇侃云以侯是五等之第二下接伯子男故稱諸侯今不取也在上不驕高而不危注諸侯列國之君貴在人上可謂高矣而能不驕則免危也制節謹度滿而不溢注費用約儉謂之制節愼行禮法謂之謹度無禮為驕奢泰為溢高而不危所以長守貴也滿而不溢所以長守富也富貴不離其身然後能保其社稷而和其民人注列國皆有社稷其君主而祭之言富貴常在其身則長為社稷之主而人自和平也蓋諸侯之孝也音義溢音逸費芳味反用如字約於略反儉勤檢反奢書蛇反泰音太離力智反注同疏正義曰夫子前述天子行孝之事已畢次明諸侯行孝也言諸侯在一國臣人之上其位高矣高者危懼若能不以貴自驕則雖處高位終不至於傾危也積一國之賦稅其府庫充滿矣若制立節限愼守法度則雖充滿而不至盈溢也滿謂充實溢謂奢侈書稱位不期驕祿不期侈是知貴不與驕期而驕自至富不與侈期而侈自來言諸侯貴為一國人主富有一國之財故宜戒之也又覆述不危不溢之義言居髙位而不傾危所以常守其貴財貨充滿而不為溢所以長守其富使富貴長久不去離其身然後乃能安其國之社稷而協和所統之臣人謂社稷以此安臣人以此和也言此上所陳蓋是諸侯之行孝也皇侃云民是廣及無知人是稍識仁義即府史之徒故言民人明遠近皆和悅也援神契云諸侯行孝曰度言奉天子之法度得不危溢是榮其先祖也注諸侯至危也正義曰云諸侯列國之君者經典皆謂天子之國為王國諸侯之國為列國詩云思皇多士生此王國則天子之國也左傳魯叔孫豹云我列國也鄭子産云列國一同是諸侯之國也列國者言其國君皆以爵位尊卑及土地大小而敘列焉五等皆然云貴在人上可謂高矣者言諸侯貴在一國臣人之上其位高也云而能不驕則免危也者言其為國以禮能不陵上慢下則免傾危也注費用至為溢正義曰云費用約儉謂之制節者此依鄭注釋制節也謂費國之財以供已用每事儉約不為華侈則論語道千乘之國云節用而愛人是也云慎行禮法謂之謹度者此釋謹度也言不可奢僭當須慎行禮法無所乖越動合典章皇侃云謂宫室車旗之類皆不奢僭也云無禮為驕奢泰為溢者皆謂華侈放恣也前未解驕今於此注與溢相對而釋之言無禮謂陵上慢下也皇侃云在上不驕以戒貴應云溢財不奢以戒富若云制節謹度以戒富亦應云制節謹身以戒貴此不例者互其文也但驕由居上故戒貴云在上溢由無節故戒富云制節也注列國至平也正義曰列國已具此釋云皆有社稷者韓詩外傳云天子大社東方青南方赤西方白北方黑中央黃土若封四方諸侯各割其方色土苴以白茅而與之諸侯以此土封之為社明受於天子也社即土神也經典所論社稷皆連言之皇侃以為稷五穀之長亦為土神據此稷亦社之類也言諸侯有社稷乃有國無社稷則無國也云其君主而祭之者案左傳曰君人者社稷是主社稷因地故以列國言之祭必由君故以其君言之云言富貴常在其身者此依王注釋富貴不離其身也云則長為社稷之主者釋保其社稷也云而人自和平也者釋而和其民人也然經上文先貴後富言因貴而富也下覆之富在貴先者此與易繫辭崇高莫大乎富貴老子云富貴而驕皆隨便而言之非富合先於貴也經傳之言社稷多矣案左傳曰共工氏之子曰勾龍為后土后土為社有烈山氏之子曰柱為稷自夏以上祀之周棄亦為稷自商以來祀之言勾龍柱棄配社稷而祭之即勾龍柱棄非社稷也又條牒云稷壇在社西俱北鄉並列同營共門並如條之説詩云戰戰兢兢如臨深淵如履薄冰注戰戰恐懼兢兢戒愼臨深恐墜履冰恐陷義取為君恆須戒懼音義詩云此詩小雅節南山之什小旻卒章戰章扇反兢棘冰反恐丘勇反懼也下同陷陷沒之陷疏正義曰夫子述諸侯行孝終畢乃引小雅小旻之詩以結之言諸侯富貴不可驕溢常須戒懼故戰戰兢兢常如臨深履薄也注戰戰至戒懼正義曰此依鄭注也案毛詩傳云戰戰恐也兢兢戒也此注恐下加懼戒下加慎足以圓文也云臨深恐墜履薄恐陷者亦毛詩傳文也恐墜謂如入深淵不可復出恐陷謂沒在冰下不可拯濟也云義取為君常須戒愼者引詩大意如此卿大夫章第四疏正義曰次諸侯之貴者即卿大夫焉説文云卿章也白虎通云卿之為言章也章善明理也大夫之為言大扶扶進人者也故傳云進賢逹能謂之卿大夫王制云上大夫卿也又典命云王之卿六命其大夫四命則為卿與大夫異也今連言者以其行同也非先王之法服不敢服注服者身之表也先王制五服各有等差言卿大夫遵守禮法不敢僭上逼下非先王之法言不敢道非先王之德行不敢行注法言謂禮法之言德行謂道德之行若言非法行非德則虧孝道故不敢也是故非法不言非道不行注言必守法行必遵道口無擇言身無擇行注言行皆遵法道所以無可擇也言滿天下無口過行滿天下無怨惡注禮法之言焉有口過道德之行自無怨惡三者備矣然後能守其宗廟注三者服言行也禮卿大夫立三廟以奉先祖言能備此三者則能長守宗廟之祀蓋卿大夫之孝也音義德行之行下孟反注德行及下擇行行滿皆同過古卧反注同惡烏路反舊如字注同廟本或作庿疏正義曰夫子述諸侯行孝之事終畢次明卿大夫之行孝也言大夫委贄事君學以從政立廟則接對賓客出聘則將命他邦服飾言行須遵禮典非先王禮法之衣服則不敢服之於身若非先王禮法之言辭則不敢道之於口若非先王道德之景行亦不敢行之於身就此三事之中言行尤須重愼是故非禮法則不言非道德則不行所以口無可擇之言身無可擇之行也使言滿天下無口過行滿天下無怨惡服飾言行三者無虧然後乃能守其先祖之宗廟蓋是卿大夫之行孝也援神契云卿大夫行孝曰譽蓋以聲譽為義謂言行布滿天下能無怨惡遐邇稱譽是榮親也舊説云天子諸侯各有卿大夫此章既云言行滿於天下又引詩云夙夜匪懈以事一人是舉天子卿大夫也天子卿大夫尚爾則諸侯卿大夫可知也注服者至逼下正義曰云服者身之表也者此依孔傳也左傳曰衣身之章也彼注云章貴賤言服飾所以章其貴賤章則表之義也云先王制五服各有等差者案尚書臯陶篇曰天命有德五服五章哉孔傳云五服天子諸侯卿大夫士之服也尊卑采章各異是有等差也云言卿大夫遵守禮法不敢僭上逼下者僭上謂服飾過制僭擬於上也逼下謂服飾儉固逼迫於下也卿大夫言必守法行必遵德服飾須合禮度無宜僭逼故劉炫引禮證之曰君子上不僭上下不逼下是也又案尚書益稷篇稱命禹曰豫欲觀古人之象日月星辰山龍華蟲作會宗彜藻火粉米黼黻絺繡以五采彰施於五色作服汝明孔傳曰天子服日月而下諸侯自龍袞而下至黼黻士服藻火大夫加粉米上得兼下下不得僭上此古之天子冕服十二章以日月星辰及山龍華蟲六章畫於衣衣法於天畫之為陽也以藻火粉米黼黻六章繡之於裳裳法於地繡之為隂也日月星辰取照臨於下山取興雲致雨龍取變化無窮華蟲謂雉取耿介藻取文章火取炎上以助其德粉取潔白米取能養黼取斷割黻取背惡鄉善皆為百王之明戒以益其德諸侯自龍袞而下八章也四章畫於衣四章繡於裳大夫藻火粉米四章也二章畫於衣二章繡於裳孔安國蓋約夏殷章服為説周制則天子冕服九章象陽之數極也案鄭注周禮司服稱至周而以日月星辰畫於旌旗所謂三辰旗旗昭其明也又云登龍於山登火於宗彜尊其神明也古文以山為九章之首火在宗彜之下周制以龍為九章之首火在宗彜之上是登龍於山登火於宗彜也又案司服云王祀昊天上帝則服大裘而冕祀五帝亦如之享先王則袞冕享先公饗射則鷩冕祀四望山川則毳冕祭社稷五祀則絺冕羣小祀則玄冕而冕服九章也又案鄭注九章初一曰龍次二曰山次三曰華蟲次四曰火次五曰宗彜皆畫以為繢次六曰藻次七曰粉米次八曰黼次九曰黻皆絺以為繡則袞之衣五章裳四章凡九也鷩畫以雉謂華蟲也其衣三章裳四章凡七章毳畫虎蜼謂宗彜也其衣三章裳二章几五也絺刺粉米無畫也其衣一章裳二章凡三也玄者衣無文裳刺黻而已是以謂玄焉凡冕服皆玄衣纁裳又案司服公之服自袞冕而下如王之服侯伯之服自鷩冕而下子男之服自毳冕而下卿大夫之服自玄冕而下士之服自皮辨而下如大夫之服則周自公侯伯子男其服之章數又與古之象服差矣注法言至敢也正義曰云法言謂禮法之言者此則論語云非禮勿言是也云德行謂道德之行者即論語云志於道據於德是也云若言非法行非德者即王制云言偽而辨行偽而堅是也云則虧孝道故不敢也者釋所以不敢之意也注言必至遵道正義曰此依正文釋非法不言非道不行也注言行至擇也正義曰言不守禮法行不遵道德皆已而法之經言無擇謂令言行無可擇也注禮法至怨惡正義曰口有過惡者以言之非禮法行有怨惡者以所行非道德也若言必守法行必遵道則口無過怨惡無從而生注三者至之祀正義曰云三者服言行也者此謂法服法言德行也然言之與行君子所最謹出已加人發邇見遠出言不善千里違之其行不善譴辱斯及故首章一敘不毁而再敘立身此章一舉法服而三復言行也則知表身者以言行不虧不毁猶易立身難備也皇侃云初陳教本故舉三事服在身外可見不假多戒言行出於內府難明必須備言最於後結宜應總言謂人相見先觀容飾次交言辭後謂德行故言三者以服為先德行為後也云禮卿大夫立三廟者義見末章云以奉先祖者謂奉事其祖考也云言能備此三者則能長守宗廟之祀者言卿大夫若能備服飾言行故能守宗廟也詩云夙夜匪懈以事一人注夙早也懈惰也義取為卿大夫能早夜不惰敬事其君也音義詩云此大雅蕩之什蒸民篇語懈佳賣反字或作解注同惰古卧反下同疏正義曰夫子既述卿大夫行孝終畢乃引大雅蒸民之詩以結之言卿大夫當早起夜寐以事天子不得懈惰匪猶不也注夙早至君也正義曰夙早也釋詁文懈惰也釋言文云義取為卿大夫能早夜不惰者引詩大意如此云敬事其君也者釋以事一人不言天子而言君者欲通諸侯卿大夫也士章第五正義曰次卿大夫者即士也案説文曰數始於一終於十孔子曰推一答十為士毛詩傳曰士者事也白虎通曰士者事也任事之稱也故禮辨名記曰士者任事之稱也傳曰通古今辨然不然謂之士資於事父以事母而愛同資於事父以事君而敬同注資取也言愛父與母同敬父與君同故母取其愛而君取其敬兼之者父也注言事父兼愛與敬也故以孝事君則忠注移事父孝以事於君則為忠矣以敬事長則順注移事兄敬以事於長則為順矣忠順不失以事其上然後能保其祿位而守其祭祀注能盡忠順以事君長則常安祿位永守祭祀蓋士之孝也音義兼古恬反并也長丁丈反注同疏正義曰夫子述卿大夫行孝之事終次明士之行孝也言士始升公朝離親入仕故此敘事父之愛敬宜均事母與事君以明割恩從義也資者取也取於事父之行以事母則愛父與愛母同取於事父之行以事君則敬父與敬君同母之於子先取其愛君之於臣先取其敬皆不奪其性也若兼取愛敬者其惟父乎既説愛敬取捨之理遂明出身入仕之行故者連上之辭也謂以事父之孝移事其君則為忠矣以事兄之敬移事於長則為順矣長謂公卿大夫言其位長於士也又言事上之道在於忠順二者皆能不失則可事上矣上謂君與長也言以忠順事上然後乃能保其祿秩官位而長守先祖之祭祀蓋士之孝也援神契云士行孝曰究以明審為義當須能明審資親事君之道是能榮親也白虎通云天子之士獨稱元士蓋士賤不得體君之尊故加元以别於諸侯之士也此直言士則諸侯之士前言大夫是戒天子之大夫諸侯之大夫可知也此章戒諸侯之士則天子之士亦可知也注資取至君同正義曰云資取也者此依孔傳也案鄭注表記考工記並同訓資取也注言愛父與母同敬父與君同者謂事母之愛事君之敬並同於父也然愛之與敬俱出於心君以尊高而敬深母以鞠育而愛厚劉炫曰夫親至則敬不極此情親而恭少尊至則愛不極此心敬而恩殺也故敬極於君愛極於母梁王云天子章陳愛敬以辨化也此章陳愛敬以辨情也注言事至敬也正義曰此依王注也劉炫曰母親至而尊不至豈則尊之不極也君尊至而親不至豈則親之不極也惟父既親且尊故曰兼也劉巘曰父情天屬尊無所屈故愛敬雙極也注移事至忠矣正義曰此依鄭注也揚名章云君子之事親孝故忠可移於君是也舊説云入仕本欲安親非貪榮貴也若用安親之心則為忠也若用貪榮之心則非忠也嚴植之曰上云君父敬同則忠孝不得有異言以至孝之心事君必忠也注移事至順矣正義曰此依鄭注也下章云事兄悌故順可移於長注不言悌而言敬者順經文也左傳曰兄愛弟敬又曰弟順而敬則知悌之與敬其義同焉尚書云邦伯師長安國曰衆長公卿也則知大夫以上皆是士之長注能盡至祭祀正義曰謂能盡忠順以事君長則能保其祿位也祿謂廩食位謂爵位廣雅曰位涖也涖下為位王制云上農夫食九人謂諸侯之下士視上農夫中士倍下士上士倍中士祭者際也神人相接故曰際也祀者似也謂祀者似將見先人也士亦有廟經不言耳大夫既言宗廟士可知也士言祭祀則大夫之祭祀亦可知也皆互以相明也諸侯言保其社稷大夫言守其宗廟士則保守並言者皇侃云稱保者安鎮也守者無逸也社稷祿位是公故言保宗廟祭祀是私故言守也士初得祿位故兩言之也詩云夙興夜寐無忝爾所生注忝辱也所生謂父母也義取早起夜寐無辱其親也音義詩云此詩小雅節南山之什小宛篇語寐面利反忝辱也他簟反所生謂父母疏正義曰夫子述士行孝畢乃引小雅小宛之詩以證之也言士行孝當早起夜寐無辱其父母也注忝辱至親也正義曰云忝辱也者釋言文云所生謂父母也者下章云父母生之是也云義取早起夜寐無辱其親也者亦引詩之大意也孝經注疏卷二孝經注疏卷二考證諸侯章疏侯是五等之第二臣清植按侯雖五等之一然既言諸侯則於五等之爵皆可以兼之矣疏説未免太泥高而不危所以長守貴也滿而不溢所以長守富也古文無兩也字蓋諸侯之孝也古文無也字非先王之法服不敢服疏孔安國蓋約夏殷章服為説臣照按安國所傳者虞書則所言當是有虞氏之章服不必别言夏殷但有虞世遠不可考而安國所言又不盡周制故邢氏謂是約夏殷以為説也然後能保其祿位古文祿位作爵祿此卿大夫之孝也古文無也字孝經注疏卷二考證

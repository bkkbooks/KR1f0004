body:
  text: 孝經注疏卷四唐明皇御注陸德明音義宋邢昺疏孝治章第八疏正義曰夫子述此明王以孝治天下也前章明先王因天地順人情以為教此章言明王由孝而治故以名章次三才之後也子曰昔者明王之以孝治天下也注言先代聖明之王以至德要道化人是為孝理不敢遺小國之臣而況於公侯伯子男乎注小國之臣至卑者耳王尚接之以禮況於五等諸侯是廣敬也故得萬國之歡心以事其先王注萬國舉其多也言行孝道以理天下皆得歡心則各以其職來助祭也疏正義曰此章之首稱子曰者為事訖更别起端首故也言昔者聖明之王能以孝道治於天下大教接物故不敢遺小國之臣而况於五等之君乎言必禮敬之明王能如此故得萬國之歡心謂各修其德盡其歡心而來助祭以事其先王經先王有六焉一曰先王有至德二曰非先王之法服三曰非先王之法言四曰非先王之德行五曰先王見教之此皆指先代行孝之王此章云以事其先王則指行孝王之考祖注言先至孝理正義曰此云釋孝治之義也國語云古曰在昔昔曰先民尚書洪範睿作聖左傳照臨四方曰明昔者非當時代之名明王則聖王之稱也是泛指前代聖王之有德者經言明王還指首章之先王也以代言之謂之先王以聖明言之則為明王事義相同故注以至德要道釋之注小國至敬也正義曰此依王注義也五等諸侯則公侯伯子男舊解云公者正也言正行其事侯者候也言斥候而服事伯者長也為一國之長也子者字也言字愛於小人也男者任也言任王之職事也爵則上皆勝下若行事亦互相通舜典曰輯五瑞孔安國曰舜斂公侯伯子男之瑞圭璧斯則堯舜之代已有五等諸侯也論語云殷因於夏禮周因於殷禮案尚書武成篇云列爵惟五分土惟三鄭注王制云殷所因夏爵三等之制也是有公侯伯而無子男武王增之總建五等時九州界狹故土惟三等則王制云公侯方百里伯七十里子男五十里至周公攝政斥大九州之界增諸侯之大者地方五百里侯四百里伯三百里子二百里男百里然據鄭玄夏殷不建子男武王復增之也案五等公為上等侯伯為次等子男為下等則小國之臣謂子男卿大夫況此諸侯則至卑也曲禮云列國之大夫入天子之國曰某士諸侯言列國者兼小大是小國之卿大夫有見天子之禮也言雖至卑盡來朝聘則天子以禮接之案周禮掌客云王公饔餼九牢飱五牢侯伯饔餼七牢飱四牢子男饔五牢飱三牢三等其五等之介行人宰史皆有飱饔餼唯上介有禽獸其卿大夫士有特來聘問者則待之如其為介時也是待諸侯及其臣之禮是皆廣敬之道也注萬國至祭也正義曰云萬國舉其多也者此依魏注也詩書之言萬國者多矣亦猶言萬方是舉多而言之不必數滿於萬也皇侃云春秋稱禹會諸侯於塗山執玉帛者萬國言禹要服之內地方七千里而置九州九州之中有方百里七十里五十里之國計有萬國也因引王制殷之諸侯有千七百七十三國也孝經稱周諸侯有九千八百國所以證萬國為夏法也信如此説則周頌云綏萬邦六月云萬邦為憲豈周之代復有萬國乎今不取也云言行孝道以理天下皆得歡心則各以其職來助祭也者言明王能以孝道理於天下則得諸侯之歡心以事其先王也各以其職來祭者謂天下諸侯各以其所職貢來助天子之祭也知者禮器云大饗其王事與注云盛其饌與貢謂祫祭先王又云三牲魚臘四海九州之美味也籩豆之薦四時之和氣也注云此饌諸侯所獻又云內金示和也注云此所貢也內之庭實先設之金從革性和荆楊二州貢金三品又云束帛加璧尊德也注云貢享所執致命者君子於玉比德焉又云龜為前列先知也注云龜知事情者陳於庭在前荆州納錫大龜又云金次之見情也注云金照物金有兩義先入後設又云丹漆絲纊竹箭與衆共財也注云萬民皆有此物荆州貢丹兖州貢漆絲豫州貢纊揚州貢篠簜又云其餘無常貨各以其國之所有則致逺物也注云其餘謂九州之外夷服鎮服蕃服之國周禮九州之外謂之蕃國世一見各以其所貴寶為贄周穆王征犬戎得白狼白鹿近之大傳云遂率天下諸侯執豆籩駿奔走又周頌曰駿奔走在廟此皆助祭者也治國者不敢侮於鰥寡而況於士民乎注理國謂諸侯也鰥寡國之微者君尚不敢輕侮況知禮義之士乎故得百姓之歡心以事其先君注諸侯能行孝理得所統之歡心則皆恭事助其祭享也音義侮亡甫反鰥古頑反無妻曰鰥寡無夫曰寡疏正義曰此説諸侯之孝治也言諸侯以孝道治其國者尚不敢輕侮於鰥夫寡婦而況於知禮義之士民乎亦言必不輕侮也以此故得其國內百姓歡悅以事其先君也注理國至士乎正義曰云理國謂諸侯也者此依魏注也案周禮云體國經野詩曰生此王國是其天子亦言國也易曰先王以建萬國親諸侯是諸侯之國上言明王理天下此言理國故知諸侯之國也云鰥寡國之微者君尚不敢輕侮者案王制云老而無妻者謂之鰥老而無夫者謂之寡此天民之窮而無告者也則知鰥夫寡婦是國之微賤者也言微賤之者國君尚不輕侮況知禮義之士乎釋經之士民詩云彼都人士左傳曰多殺國士此皆説指有知識之人不必居官授職之士舊解士知義理又曰士丈夫之美稱故注言知禮義之士乎謂民中知禮義者注諸侯至享也正義曰云諸侯能行孝理得所統之歡心者此言諸侯孝治其國得百姓之歡心也一國百姓皆是君之所統理故以所統言之孔安國曰亦以相統理是也云則皆恭事助其祭享也者祭享謂四時及禘祫也於此祭享之時所統之人則皆恭其職事獻其所有以助於君故云助其祭享也治家者不敢失於臣妾而況於妻子乎注理家謂卿大夫臣妾家之賤者妻子家之貴者故得人之歡心以事其親注卿大夫位以材進受祿飬親若能孝理其家則得小大之歡心助其奉飬音義飬羊尚反疏正義曰説卿大夫之孝治也言以孝道理治其家者不敢失於其家臣妾賤者而況於妻子之貴者乎言必不失也故得其家之歡心以承事其親也注理家至貴者正義曰云理家謂卿大夫者此依鄭注也案下章云大夫有爭臣三人雖無道不失其家禮記王制曰上大夫卿則知治家謂卿大夫云臣妾家之賤者案尚書費誓曰竊馬牛誘臣妾孔安國云誘偷奴婢既以臣妾為奴婢是家之賤者也云妻子家之貴者案禮記哀公問於孔子孔子對曰妻者親之主也敢不敬與子者親之後也敢不敬與是妻子家之貴者也注卿大夫至奉飬正義曰云卿大夫位以材進者案毛詩傳曰建邦能命龜田能施命作器能銘使能造命升髙能賦師旅能誓山川能説喪紀能誄祭祀能語君子能此九者可謂有德音可以為大夫是位以材進也云受祿飬親者言能孝理其家則受其所稟之祿以飬其親云若能孝理其家則得小大之歡心者謂小大皆得其歡心小謂臣妾大謂妻子也云助其奉飬者案禮記內則稱子事父母婦事舅姑日以雞初鳴咸盥潄以適父母舅姑之所問衣燠寒饘酏酒醴芼羹菽麥蕡稻黍梁秫唯所欲棗栗飴蜜以甘之父母舅姑必嘗之而後退此皆奉飬事親也天子諸侯繼父而立故言先王先君也大夫惟賢是授居位之時或有俸祿以逮於親故言其親也注順經文所以言助其奉飬此謂事親生之義也若親以終沒亦當言助其祭祀也明王言不敢遺小國之臣諸侯言不敢侮於鰥寡大夫言不敢失於臣妾者劉炫云遺謂意不存録侮謂忽慢其人失謂不得其意小國之臣位卑或簡其禮故云不敢遺也鰥寡人中賤弱或被人輕侮欺陵故云不敢侮也臣妾營事産業宜須得其心力故云不敢失也明王況公侯伯子男諸侯況士民卿大夫況妻子者以王者尊貴故況列國之貴者諸侯差卑故況國中之卑者以五等皆貴故況其卑也大夫或事父母故況家人之貴者也夫然故生則親安之祭則鬼享之注夫然者上孝理皆得歡心則存安其榮沒享其祭是以天下和平災害不生禍亂不作注上敬下歡存安沒享人用和睦以致太平則災害禍亂無因而起故明王之以孝治天下也如此注言明王以孝為理則諸侯以下化而行之故致如此福應音義夫音符享許文反災則才反本或作災疏正義曰此總結天子諸侯卿大夫之孝治也言明王孝治其下則諸侯以下各順其教皆治其國家也如此各得歡心親若存則安其孝養沒則享其祭祀故得和氣降生感動昭昧是以普天之下和睦太平災害之萌不生禍亂之端不起此謂明王之以孝治天下也能致如此之美注夫然者至其祭正義曰云夫然者上孝理皆得歡心者此謂明王諸侯大夫能行孝治皆得其歡心也云則存安其榮者釋生則親安之云沒享其祭者釋祭則鬼享之也注上敬至而起正義曰此釋天下和平以皆由明王孝治之所致也皇侃云天反時為災謂風雨不節地反物為妖妖即害物謂水旱傷禾稼也善則逢殃為禍臣下反逆為亂也注言明至福應正義曰云言明王以孝為理則諸侯以下化而行之者案上文有明王諸侯大夫三等而經獨言明王孝治如此者言由明王之故也則諸侯以下奉而行之而功歸於明王也云故致如此福應者福謂天下和平應謂災害不生禍亂不作詩云有覺德行四國順之注覺大也義取天子有大德行則四方之國順而行之音義詩云此大雅蕩之什抑篇語覺音角大也德行之行下孟反注德行同疏正義曰夫子述昔時明王孝治之義畢乃引大雅抑篇贊美之也言天子身有至大德行使四方之國皆順而行之注覺大至行之正義曰云覺大也者此依鄭注也故詩箋云有大德行則天下順從其化是以覺為大也云義取天子有大德行則四方之國順而行之者言引詩之大意如此也孝經注疏卷四孝經注疏卷四考證以事其先君疏祭享謂四時及禘祫也臣清植按不王不禘此經乃言諸侯之祭疏兼禘言蓋誤不敢失於臣妾古文失作誨故明王之以孝治天下也如此古文無也字孝經注疏卷四考證

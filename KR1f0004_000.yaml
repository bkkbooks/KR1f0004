body:
  text: 孝經注疏孝經類目録孝經注解傳述人孝經注疏序孝經序卷一開宗明義章天子章卷二諸侯章卿大夫章士章卷三庶人章三才章卷四孝治章卷五聖治章卷六紀孝行章五刑章廣要道章卷七廣至德章廣揚名章諫諍章卷八感應章事君章卷九喪親章臣等謹按孝經正義三卷唐元宗御注宋郉昺疏案唐會要開元十年六月上注孝經頒天下及國子學天寶二年五月上重注亦頒天下舊唐書經籍志孝經一卷元宗注唐書藝文志今上孝經制旨一卷注曰元宗其稱制旨者猶梁武帝中庸義之稱制旨實一書也趙明誠金石録載明皇注孝經四卷陳振孫書録解題亦稱家有此刻為四大軸蓋天寶四載九月以御注刻石于太學謂之石臺孝經今尚在西安府學中為碑凡四故拓本稱四卷耳元宗御製序末稱一章之中凡有數句一句之內義有兼明具載則文繁略之則義闕今存于疏用廣發揮唐書元行沖傳稱元宗自注孝經詔行沖為疏立於學官唐會要又載天寶五載詔孝經書疏雖粗發明未能該備今更敷暢以廣闕文令集賢院寫頒中外是注凡冉修疏亦冉修其疏唐志作二卷宋志則作三卷殆續增一卷歟宋咸平中邢昺所修之疏即據行沖書為藍本然孰為舊文孰為新説今已不可辨别矣孝經有今文古文二本今文稱鄭元注其説傳自荀昶而鄭志不載其名古文稱孔安國注其書出自劉炫而隋書已言其偽至唐開元七年三月詔令羣儒質定右庶子劉知幾主古文立十二驗以駁鄭國子祭酒司馬貞主今文摘閨門章文句凡鄙庶人章割製舊文妄加子曰字及注中脫衣就功諸語以駁孔其文具載唐會要中厥後今文行而古文廢元熊禾作董鼎孝經大義序遂謂貞去閨門一章卒啓元宗無禮無度之禍明孫本作孝經辨疑併謂唐宫闈不肅貞削閨門一章乃為國諱夫削閨門一章遂啓幸蜀之釁使當時行用古文果無天寶之亂乎唐宫闈不肅誠有之至于閨門章二十四字則絶與武韋不相涉指為避諱不知所避何諱也况知幾與貞兩議並上會要載當時之詔乃鄭依舊行用孔注傳習者稀亦存繼絶之典是未因知幾而廢鄭亦不因貞而廢孔逮時閲三年乃有御注太學刻石署名者三十六人貞不預列御注既行孔鄭兩家遂併廢亦未聞貞更建議廢孔也禾等徒以朱子刋誤偶用古文遂不以不用古文為大罪又不能知唐時典故徒聞中興書目有議者排毁古文遂廢之語遂沿其説説憒憒然歸罪于貞不知以注而論則孔佚鄭亦佚孔佚罪貞鄭佚又罪誰乎以經而論則鄭存孔亦存古文並未因貞一議亡也貞又何罪焉今詳考源流明今文之立自元宗此注始元宗此注之立自宋詔邢昺等修此疏始衆説喧呶皆揣摩影響之談置之不論不議可矣乾隆四十一年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書孝經注解傳述人唐國子博士兼太子中允贈齊州刺史吳縣開國男陸德明録孝經者孔子為弟子曾參説孝道因明天子庶人五等之孝事親之法亦遭焚燼河間人顔芝為秦禁藏之漢氏尊學芝子貞出之是為今文長孫氏博士江翁少府后蒼諫大夫翼奉安昌侯張禹傳之各自名家凡十八章又有古文出于孔氏壁中别有閨門一章自餘分析十八章總為二十二章孔安國作傳劉向校書定為十八後漢馬融亦作古文孝經傳而世不傳世所行鄭注相承以為鄭玄案鄭志及中經簿無唯中朝穆帝集講孝經云以鄭玄為主檢孝經注與康成注五經不同未詳是非江左中興孝經論語共立鄭氏博士一人古文孝經世既不行今隨俗用鄭注十八章本孔安國馬融鄭衆鄭玄王肅蘇林字孝友陳留人魏散騎常侍何晏字平叔南陽人魏吏部尚書駙馬都尉關內侯劉劭字孔才廣平人魏光祿勳一云劉熙韋昭字𢎞嗣吳郡人吳侍中領左國史高陵亭侯為晉諱改為曜徐整謝萬孫氏不詳何人楊泓天水人東晉給事中袁宏字彥伯陳郡人東晉東陽太守虞槃佑字𢎞猷高平人東晉處士庾氏不詳何人殷仲文陳郡人東晉東陽太守車胤字武子南平人東晉丹陽尹荀昶字茂祖潁川人宋中書郎孔光字文泰東莞人何承天東海人宋廷尉卿釋慧琳秦郡人宋世沙門王玄載字彥休下邳人齊光祿大夫明僧紹並注孝經皇侃撰義疏先儒無為音者孝經注解傳述人孝經注解傳述人考證注解傳述人長孫氏博士江翁少府后蒼諫大夫翼奉安昌侯張禹傳之漢書藝文志長孫氏説二篇江氏翼氏后氏説各一篇安昌侯説一篇又有古文出于孔氏壁中臣清植按家語云孔騰藏尚書孝經論語於夫子舊堂壁中漢紀尹敏傳云孔鮒所藏隋志云武帝時魯共王壞孔子宅得其末孫惠所藏之書皆古文也史通亦以為孔惠所藏諸編互異未詳孰是孔安國作傳家語後序安國為孝經傳二篇劉向校書定為十八臣清植按説文云古文孝經建武時議郎衛宏所校者古文也此則並合今古文而校之今隨俗用鄭注十八章本臣清植按三朝志五代以來孔鄭注皆亡周顯德中新羅獻别序孝經即鄭注者而崇文總目以為咸平中日本僧奝然所獻未審孰是孝經注解傳述人考證欽定四庫全書孝經注疏序翰林侍講學士朝請大夫守國子祭酒上柱國賜紫金魚袋臣邢昺等奉敕校定注疏孝經者百行之宗五教之要自昔孔子述作垂範將來奧旨微言已備解乎注疏尚以辭高旨遠後學難盡討論今特剪截元疏旁引諸書分義錯經會合歸趣一依講説次第解釋號之為講義也孝經注疏序孝經注疏序成都府學主鄉貢傅注奉右撰夫孝經者孔子之所述作也述作之旨者昔聖人蘊大聖德生不偶時適值周室衰微王綱失墜君臣僭亂禮樂崩頽居上位者賞罰不行居下位者褒貶無作孔子遂乃定禮樂刪詩書讚易道以明道德仁義之源修春秋以正君臣父子之法又慮雖知其法未知其行遂説孝經一十八章以明君臣父子之行所寄知其法者修其行知其行者謹其法故孝經緯曰孔子云欲觀我褒貶諸侯之志在春秋崇人倫之行在孝經是知孝經雖居六籍之外乃與春秋為表矣先儒或云夫子為曾參所説此未盡其指歸也蓋曾子在七十弟子中孝行最著孔子乃假立曾子為請益問答之人以廣明孝道既説之後乃屬與曾子洎遭暴秦焚書並為煨燼漢膺天命復闡微言孝經河間顔芝所藏因始傳之于世自西漢及魏歷晉宋齊梁注解之者逮及百家至有唐之初雖備存祕府而簡編多有殘缺傳行者唯孔安國鄭康成兩家之注並有梁博士皇侃義疏播於國序然辭多紕謬理昧精研至唐玄宗朝乃詔羣儒學官俾其集議是以劉子玄辨鄭注有十謬七惑司馬堅斥孔注多鄙俚不經其餘諸家注解皆榮華其言妄生穿鑿明皇遂於先儒注中採托菁英芟去煩亂撮其義理允當者用為注解至天寶二年注成頒行天下仍自八分御札勒于石碑即今京兆石臺孝經是也孝經注疏序孝經注疏序考證孝經注疏序孔子乃假立曾子為請益問答之文呂維祺曰所云假立曾子斷不其然朱子直以為曾子門人記録之書觀仲尼居曾子侍及中間子曰字理亦近似蓋此書疑曾子與其門人所記然必有經孔子裁定故曰行在孝經也臣照按孔子曰吾志在春秋行在孝經春秋天子之事也孔子作春秋託諸空言而非見諸實事必明王興而孔子輔之乃能為東周以行其志故曰志在春秋若孝經則大夫有大夫之孝士有士之孝庶人有庶人之孝殊塗而同歸莫非則天明而事地察固實事而非空言故曰行在孝經如以曾經孔子裁定而為行在孝經則春秋者孔子筆則筆削則削遊夏不能贊一辭矣豈轉不得為行在春秋乎孝經注疏序考證欽定四庫全書孝經序唐明皇撰宋郉昺疏御製序並注疏正義曰孝經者孔子為曾參陳孝道也漢初長孫氏博士江翁少府后倉諫大夫翼奉安昌侯張禹傳之各自名家經文皆同唯孔氏壁中古文為異至劉炫遂以古孝經庶人章分為二曾子敢問章分為三又多閨門一章凡二十二章桓談新論云古孝經千八百七十二字今異者四百餘字孝者事親之名經者常行之典按漢書藝文志云夫孝天之經地之義民之行也舉大者言故曰孝經又按禮記祭統云孝者畜也畜養也釋名云孝好也周禮諡法至順曰孝總而言之道常在心盡其色養中情悅好承順無怠之義也爾雅善事父母為孝皇侃云經者常也法也此經為教任重道遠雖復時移代革金石可消而為孝事親常行存世不滅是其常也為百代規模人生所資是其法也言孝之為教使可常而法之易有上經下經老子有道經德經孝為百行之本故名曰孝經經之創制孔子所撰也前賢以為曾參雖有至孝之性未達孝德之本偶於間居因得侍坐參起問於夫子夫子隨而答參是以集録因名為孝經尋繹再三將未為得也何者夫子刋緝前史而修春秋猶云筆則筆削則削四科十哲莫敢措辭案鉤命決云夫子曰吾志在春秋行在孝經斯則修春秋撰孝經孔子之志行也何為重其志而自筆削輕其行而假他人者乎按劉炫述義其略曰炫謂孔子自作孝經本非曾參請業而對也士有百行以孝為本本立而後道行道行而後業就故曰明王之以孝治天下也然則治世之要孰能非乎徒以教化之道因時立稱經典之目隨事表名至使威儀禮節之餘盛傳當代孝悌德行之本隱而不彰夫子運偶陵遲禮樂崩壞名教將絶特感聖心因弟子有請問之道師儒有教誨之義故假曾子之言以為對揚之體乃非曾子實有問也若疑而始問答以申辭則曾子應每章一問仲尼應每問一答按經夫子先自言之非參請也諸章以次演之非待問也且辭義血脈文連旨環而開宗題其端緒餘章廣而成之非一問一答之勢也理有所極方始發問又非請業請答之事首章言先王有至德要道則下章云此之謂要道也非至德其孰能順民皆遙結道德不答曾子也舉此為例凡有數科必其主為曾子言首章答曾子已了何由不待曾子問更自述而修之且三起曾參侍坐與之别二者是問也一者歎之也故假言乘間曾子坐也與之論孝開宗明義上陳天子下陳庶人語盡無更端於曾子未有請故假參歎孝之大又説以孝為理之功説之以終欲言其聖道莫大於孝又假參問乃説聖人之德不加於孝在前論敬順之道未有規諫之事殷勤在悅色不可頓説犯顔故須更借曾子言陳諫爭之義此在孔子須參問非參須問孔子也莊周之斥鷃笑鵬罔兩問影屈原之漁父鼓枻太卜拂龜馬卿之烏有無是揚雄之翰林子墨寧非師祖製作以為楷模者乎若依鄭説實居講堂則廣延生徒侍坐非一夫子豈凌人侮衆獨與參言邪且云汝知之乎何必直汝曾子而參先避席乎必其遍告諸生又有對者當參不讓儕輩而獨答乎假使獨與參言言畢參自集録豈宜稱師字者乎由斯言之經教發極夫子所撰也而漢書藝文志云孝經者孔子為曾參陳孝道也謂其為曾子特説此經然則聖人之有述作豈為一人而已斯皆誤本其文致兹乖謬也所以先儒注解多所未行唯鄭玄之六藝論曰孔子以六藝題目不同指意殊别恐道離散後世莫知根源故作孝經以總會之其言雖則不然其意頗近之矣然入室之徒不一獨假曾子為言以參偏得孝名也老子曰六親不和有孝慈然則孝慈之名因不和而有若萬行俱備稱為人聖則凡聖無不孝也而家有三惡舜稱大孝龍逢比干忠名獨彰君不明也孝已伯竒之名偏著母不慈也曾子性雖至孝蓋有由而發矣藜蒸不熟而出其妻家法嚴也耘瓜傷苗幾隕其命明父少恩也曾子孝名之大其或由茲固非參性遲朴躬行匹夫之孝也審考經言詳稽炫釋實藏理於古而獨得之於今者與元氏雖同炫説恐未盡善今以藝文志及鄭氏所説為得其作經年先儒以為魯哀公十四年西狩獲麟而作春秋至十六年夏四月己丑孔子卒為證則作在魯哀公十四年後十六年前案鉤命決云孔子曰吾志在春秋行在孝經據先後言之明孝經之文同春秋作也又鉤命決云孔子曰春秋屬商孝經屬參則孝經之作在春秋後也御者按大戴禮盛德篇云德法者御民之本也古之御政以治天下者冢宰之官以成道司徒之官以成德宗伯之官以成仁司馬之官以成聖司冦之官以成義司空之官以成禮故六官以為轡司會均入以為軜故曰御四馬者執六轡御天地與人與事者亦有六政是故善御者正身同轡均馬力齊馬心唯其所引而之以取長道遠行可以之急疾可以御天地與人事此四者聖人之所乘也是故天子御者內史太史左右手也六官亦六轡也天子三公合以執六官均五政齊五法以御四者故亦唯其所引而之以之道則國治以之德則國安以之仁則國和以之聖則國平以之義則國成以之禮則國定此御政之禮也然則御者治天下之名若柔轡之御剛馬也家語亦有此文是以秦漢以來以御為至尊之稱又蔡雍獨斷曰御者進也凡衣服加於身飲食入於口妃妾接於寢皆曰御至於器物製作亦皆以御言之故此云御也製者裁剪述作之謂也故左傳曰子有美錦不使人學製焉取此美名故人之文章述作皆謂之製以此序唐玄宗所撰故云御製也玄宗唐第六帝也諱隆基睿宗之子以延和元年即位時年三十三在位四十五年年七十八登遐諡曰明孝皇帝廟號玄宗開元十年製經序並注序者按詩頌云繼序思不忘毛傳云序緒也又釋詁云敘緒也是序與敘音義同郭璞云又為端緒然則此言序者舉一經之端緒耳并注者并兼也注著也解釋經指使義理著明也言非但製序兼亦作注故云並也案今俗所行孝經題曰鄭氏注近古皆謂康成而晉魏之朝無有此説晉穆帝永和十一年及孝武太元元年再聚羣臣共論經義有荀暴者撰集孝經諸説始以鄭氏為宗晉末以來多有異論陸澄以為非玄所注請不藏於袐省王儉不依其請遂得見傳至魏齊則立學官著作律令蓋由其俗無識故致斯訛舛然則經非鄭玄所注其驗有十二焉據鄭自序云遭黨錮之事逃難至黨錮事解注古文尚書毛詩論語為袁談所逼來至元城乃注周易都無注孝經之文其驗一也鄭君卒後其弟子追論師所注述及應對時人謂之鄭志其言鄭所注者唯有毛詩三禮尚書周易都不言注孝經其驗二也又鄭志目録記鄭之所注五經之外有中候大傳七政論乾象厯六藝論毛詩譜答臨碩難禮許慎異議釋廢疾發墨守針膏肓答甄守然等書寸紙片言莫不悉載若有孝經之注無容匿而不言其驗三也鄭之弟子分授門徒各述所言更為問答編録其語謂之鄭記唯載禮易論語其言不及孝經其驗四也趙商作鄭玄碑銘具載諸所注箋驗論亦不言注孝經晉中經簿周易尚書中候尚書大傳毛詩周禮儀禮禮記論語凡九書皆云鄭氏注名玄至於孝經則稱鄭氏解無名玄二字其驗五也春秋緯演孔圖注云康成注三禮詩易尚書論語其春秋孝經則有評論宋均詩譜序云我先師北海鄭司農則均是玄之傳業弟子師有注述無容不知而云春秋孝經唯有評論非玄所注特明其驗六也又宋均孝經緯注引鄭六藝論敘孝經云玄又為之注司農論如是而均無聞焉有義無辭令豫昏惑舉鄭之語而云無聞其驗七也宋均春秋緯注云為春秋孝經略説則非注之謂所言又為之注者泛辭耳非事實其敘春秋亦云玄又為之注寧可復責以實注春秋乎其驗八也後漢史書存於代者有謝承薛瑩司馬彪袁山松等其所注皆無孝經唯范曄書有孝經其驗九也王肅孝經傳首有司馬宣王奉詔令諸儒注述孝經以肅説為長若先有鄭注亦應言及而不言鄭其驗十也王肅注書好發鄭短凡有小失皆在聖證若孝經此注亦出鄭氏被肅攻擊最應煩多而肅無言其驗十一也魏晉朝賢辨論時事鄭氏諸注無不撮引未有一言孝經注者其驗十二也以此證驗易為討核而代之學者不覺其非乘後謬説競相推舉諸解不立學官此注獨行於世觀言語鄙陋義理乖謬固不可示彼後來傳諸不朽至古文孝經孔傳本出孔氏壁中語甚詳正無俟商𣙜而曠代亡逸不被流行隋開皇十四年祕書學生王逸於京市陳人處買得一本送與著作王卲以示河間劉炫仍令校定而此書更無兼本難可依憑炫輒以所見率意刋改因著古文孝經稽疑一篇故開元七年敕議之際劉子玄等議以為孔鄭二家雲泥致隔今綸旨煥發校其短長必謂行孔廢鄭於義為允國子博士司馬貞議曰今文孝經是漢河間王所得顔芝本至劉向以此參校古文省除繁惑定此一十八章其注相承云是鄭玄所作而鄭志及目録等不載故往賢共疑焉唯荀昶范曄以為鄭注故昶集解孝經具載此注為優且其注縱非鄭玄而義旨敷暢將為得所雖數處小有非穩實亦未爽經旨其古文二十二章雖出孔壁先是安國作傳緣遭巫蠱未之行也昶集注之時尚未見孔傳中朝遂亡其本近儒欲崇古學妄作傳學假稱孔氏輒穿鑿改更又偽作閨門一章劉炫詭隨妄稱其善且閨門之義近俗之語必非宣尼正説案其文云閨門之內具禮矣嚴親嚴兄妻子臣妾繇百姓徒役也是比妻子於徒役文句凡鄙不合經典又分庶人章從故自天子已下别為一章仍加子曰二字然故者逮下之辭既是章首不合言故是古人既沒後人妄開此等數章以應二十二之數非但經文不真抑亦傳文淺偽又注用天之道分地之利其略曰脫之應功暴其肌體朝暮從事露髮徒足少而習之其心安焉此語雖旁出諸子而引之為注何言之鄙俚乎與鄭氏所云分别五土視其高下高田宜黍稷下田宜稻麥優劣懸殊曾何等級今議者欲取近儒詭説而廢鄭注理實未可請準今式孝經鄭注與孔傳依舊俱行詔鄭注仍舊行用孔傳亦存是時蘇宋文吏拘於流俗不能發明古義奏議排子玄令諸儒對定司馬貞與學生郗常等十人盡非子玄卒從諸儒之説至十年上自注孝經頒於天下卒以十八章為定朕聞上古其風朴略疏正義曰自此以下至於序末凡有五假明義當假自解其指於此不復繁文今此初假序孝之所起及可以教人而為德本也朕者我也古者尊卑皆稱之故帝舜命禹曰朕志先定禹曰朕德罔克臯陶曰朕言惠可底行又屈原亦云朕皇考曰伯庸是由古人質故君臣共稱至秦始皇二十六年始定為天子之稱聞者目之不覩耳之所傳曰聞上古者經典所説不同案禮運鄭玄注云中古未有釡甑則謂神農為中古若易厯三古則伏犧為上古文王為中古孔子為下古若三王對五帝則五帝亦為上古故士冠記云大古冠布下云三王共皮辨則大古五帝時也大古亦上古也以其文各有所對故上古中古不同也此云上古者亦謂五帝以上也知者以下云及乎仁義既有以禮運及老子言之仁義之盛在三王之世則此上古自然當五帝以上也云其風朴略者風教也朴質也略疏也言上古之君貴尚道德其於教化則質朴疏略也雖因心之孝已萌而資敬之禮猶簡疏正義曰因猶親也資猶取也言上古之人有自然親愛父母之心如此之孝雖已萌兆而取其恭敬之禮節猶尚簡少也周禮大司徒教六行云孝友睦姻任恤注云因親於外親是因得為親也詩大雅皇矣云維此王季因心則友士章云資於事父以事君而敬同此其所出之文也故引以為序耳及乎仁義既有親譽益著疏正義曰及乎者語之發端連上逮下之辭也仁者兼愛之名義者裁非之謂仁義既有謂三王時也案曲禮云太上貴德鄭注云太上帝皇之世又禮運云大道之行也鄭注云大道謂五帝時老子德經云失道而後德失德而後仁失仁而後義是道德當三皇五帝時則仁義當三王之時可知也慈愛之心曰親聲美之稱曰譽謂三王之世天下為家各親其親各子其子親譽之道日益著見故曰親譽益著也聖人知孝之可以教人也疏正義曰聖人謂以孝治天下之明王也孝為百行之本至道之極故經文云聖人之德又何以加於孝乎故因嚴以教敬因親以教愛疏正義曰引下經文以證義也於是以順移忠之道昭矣立身揚名之義彰矣疏正義曰經云君子之事親孝故忠可移於君又曰立身行道揚名於後世言人事兄能悌以之事長則為順事親能孝移之事君則為忠然後立身揚名傳於後世也昭彰皆明也子曰吾志在春秋行在孝經疏正義曰此鉤命決文也言褒貶諸侯善惡志在於春秋人倫尊卑之行在於孝經也是知孝者德之本歟疏正義曰論語云孝弟也者其為仁之本歟今言孝者德之本歟歟者嘆美之辭舉其大者而言故但云孝德則行之總名故變仁言德也經曰昔者明王之以孝理天下也不敢遺小國之臣而况於公侯伯子男乎疏正義曰此第二假序已仰慕先世明王欲以博愛廣敬之道被四海也經曰至男乎此孝治章文也故言經曰言小國之臣尚不敢遺棄何况於五等列爵之君乎公侯伯子男五等之爵也白虎通曰公者通也公正無私之意也春秋傳曰王者之後稱公侯者候也候順逆也伯者長也為一國之長也子者字也常行字愛於人也男者任也常任王事也王制云公侯地方百里伯七十里子男五十里至於周公時增地益廣加賜諸侯之地公五百里侯四百里伯三百里子二百里男一百里公為上等侯伯為中等子男為下等言小國之臣謂子男之臣也朕嘗三復斯言景行先哲疏正義曰復猶覆也斯此也景明也哲智也言每讀經至此科三度反復重讀庶幾法則此有明行者先世聖智之明王也論語云南容三復白圭詩云高山仰止景行行止是其類也雖無德教加於百姓疏正義曰上遜辭也庶幾廣愛形於四海疏正義曰此上意思行教也庶幾猶幸望既謙言無德教加於百姓唯幸望以廣敬博愛之道著見於四夷也案經作刑刑法也今此作形則形猶見也義得兩通無煩改字四海即四夷也又經别釋嗟乎夫子沒而微言絶異端起而大義乖疏正義曰此第三假歎夫子沒後遭世陵遲典籍散亡傳注踳駮所以撮其樞要而自作注也嗟乎上嘆辭也夫子孔子也以嘗為魯大夫故云夫子案史記云孔子生魯國昌平陬邑魯襄公二十二年生年七十三以魯哀公十六年四月己丑卒葬魯城北泗上而微言絶者藝文志文李竒曰隱微不顯之言也顔師古曰精微要妙之言耳言夫子沒後妙言咸絶七十子既喪而異端並起大義悉乖况泯絶於秦得之者皆煨燼之末疏正義曰泯滅也秦者隴西谷名也在雍州鳥鼠山之東北昔臯陶之子伯翳佐禹治水有功舜命作虞賜姓曰嬴其末孫非子為周孝王養馬於汧渭之間封為附庸邑于秦谷及非子之曾孫秦仲周宣王又命為大夫仲之孫襄公討西戎救周周室東遷以岐豐之地賜之始列為諸侯春秋時稱秦伯至孝公子惠文君立是為惠王及莊襄王為秦質子於趙見吕不韋姬説而取之生始皇按秦昭王四十八年正月生於邯鄲及生名為政姓趙氏年十三莊襄王死政代立為秦王至二十六年平定天下號曰始皇帝三十四年置酒咸陽宫博士齊人淳于越進曰臣聞殷周之王千餘歲封子弟立功臣自為枝輔今陛下有海內而子弟為匹夫卒有田常六卿之臣無輔拂何以輔政哉丞相李斯曰五帝不相復三代不相襲非其相反時變異也今陛下創大業建萬世之功固非愚儒之所知臣請史官非秦記皆燒之非博士官所職天下敢有藏詩書百家語者悉詣守尉雜燒之制曰可三十五年以為諸生誹謗乃自除犯禁者四百六十餘人皆坑之咸陽是經籍之道滅絶於秦説文云煨盆火也燼火餘也言遭秦焚坑之後典籍滅絶雖僅有存者皆火餘之微末耳若伏勝尚書顔貞孝經之類是也濫觴於漢傳之者皆糟粕之餘疏正義曰案家語孔子謂子路曰夫江始於岷山其源可以濫觴及其至江津也不舫舟不避風雨不可以涉王肅曰觴所以盛酒者言其微也又文選郭景純江賦曰惟岷山之導江初發源乎濫觴臣翰注云濫謂泛濫小流貌觴酒盞也謂發源小如一盞漢者巴蜀之間水名也二世元年諸侯叛秦沛人共立劉季以為沛公二年八月入秦秦相趙高殺二世立二世兄子子嬰冬十月為漢元年子嬰二年春正月項羽尊楚懷王為義帝羽自立為西楚霸王更立沛公為漢王王巴蜀漢中四十一縣都南鄭五年破項羽斬之六年二月即皇帝位于汜水之陽遂取漢為天下號若商周然也漢興改秦之政大收篇籍言從始皇焚燒之後至漢氏尊學初除挾書之律有河間人顔貞出其父芝所藏凡一十八章以相傳授言其至少故曰濫觴於漢也其後浸盛則如江矣釋名曰酒滓曰糟浮米曰粕既以濫觴况其少因取糟粕比其微言醇粹既喪但餘此糟粕耳故魯史春秋學開五傳疏正義曰故者因上起下之語夫子約魯史春秋學開五傳者謂各專已學以相教授分經作傳凡有五家開則分也五傳者案漢書藝文志云左氏傳三十卷左丘明魯太史也公羊傳十一卷公羊子齊人名高受經於子夏穀梁傳十一卷名赤魯人糜信云與秦孝公同時十録云名俶字元始風俗通云子夏門人鄒氏傳十一卷漢書云王吉善鄒氏春秋夾氏傳十一卷有録無書其鄒夾二家鄒氏無師夾氏未有書故不顯于世蓋王莾時亡失耳國風雅頌分為四詩疏正義曰詩有國風小雅大雅周頌魯頌商頌故曰國風雅頌四詩者毛詩韓詩齊詩魯詩也毛詩自夫子授卜商傳至大毛公名亨大毛公授毛萇趙人為河間獻王博士先有子夏詩傳一卷萇各置其篇常存其作者至後漢大司農鄭玄為之箋是曰毛詩韓詩者漢文帝時博士燕人韓嬰所傳武帝時與董仲舒論於上前仲舒不能難至晉無人傳習是曰韓詩齊詩者漢景帝時博士清河太傅轅固生所傳號齊詩傳夏侯始昌昌授后蒼輩門人尤盛後漢陳元方亦傳之至西晉亡是曰齊詩魯詩者漢武帝時魯人申公所述以經為訓詀教之無傳疑者則闕號為魯詩去聖逾遠源流益别疏正義曰逾越也百川之本曰源水行曰流增多曰益言秦漢而下上去孔子聖越遠孝經本是一源諸家增益别為衆流謂其文不同也近觀孝經舊注踳駮尤甚疏正義曰孝經今文稱鄭玄注古文稱孔安國注先儒詳之皆非真實而學者互相宗尚踳乖也駮錯也尤過也今言觀此二注乖錯過甚故言踳駮尤甚也至於迹相祖述殆且百家疏正義曰至於者語更端之辭也迹蹤迹也祖始也因而明之曰述言學者蹤迹相尋以在前者為始後人從而述修之若仲尼祖述堯舜之為也殆近也言近且百家目其多也考其人今文則有魏王肅蘇林何晏劉劭吳韋昭謝萬徐整晉袁宏虞槃佑東晉楊泓殷仲文車胤孫氏庾氏荀昶孔光何承天釋慧琳齊王玄載明僧紹及漢之長孫氏江翁翼奉后蒼張禹鄭衆鄭玄所説各擅為一家也其梁皇侃撰義疏三卷梁武帝作講疏賀㻛嚴植之劉貞簡明山賓咸有説隋有巨鹿魏真克者亦為之訓注其古文出自孔氏壞壁本是孔安國作傳會巫蠱事其本亡失至隋王邵所得以送劉炫炫敘其得喪述其義疏議之劉綽亦作疏與鄭義俱行又馬融亦作古文孝經傳而世不傳此皆祖述名家者也業擅專門猶將十室疏正義曰上言百家者大略眥祖述而已其於傳守已業專門命氏者尚自將近十室室則家也爾雅釋宫云宫謂之室室謂之宫其內謂之家但與上百家變文耳故言十室其十室之名序不指摘不可強言蓋后蒼張禹鄭玄王肅之徒也希升堂者必自開户牖疏正義曰希望也論語云子曰由也升堂矣未入於室夫子言仲由升我堂矣未入於室耳今祖述孝經之人望升夫子之堂者既不得其門而入必自擅開門户窗牖矣言其妄為穿鑿也攀逸駕者必騁殊軌轍疏正義曰攀引也逸駕謂奔逸之車駕也案莊子顔淵問於仲尼曰夫子步亦步夫子趨亦趨夫子馳亦馳夫子奔逸絶塵而回瞪若乎後耳言夫子之道神速不可及也今祖述孝經之人欲仰慕攀引夫子奔逸之駕者既不得直道而行必馳騁於殊異之軌轍矣言不知道之無從也兩轍之間曰軌車輪所轢曰轍是以道隱小成言隱浮偽疏正義曰道者聖人之大道也隱蔽也小成謂小道而有成德者也言者夫子之至言也浮偽謂浮華泛辨也言此穿鑿馳騁之徒唯行小道華辨致使大道至言皆為隱蔽真實則不可隱故莊子內篇齊物論云道惡乎隱而有真偽言惡乎隱而有是非道惡乎往而不存言惡乎存而不可道隱於小成言隱於榮華此文與彼同唯榮華作浮偽其文意則不異也且傳以通經為義義以必當為主疏正義曰且者語辭傳者注解之别名傳釋經意傳示後人則謂之傳注者著也約文敷暢使經義著明則謂之注作傳曰題不為義例或曰前漢以前名傳後漢以來名注蓋亦未然例則馬融亦謂之傳知或説非也此言傳注解釋則以通暢經指為義義之裁斷則以必然當理為主也至當歸一精義無二疏正義曰至極之當必歸於一精妙之義焉有二三將言諸家不同宜會合之也安得不翦其繁蕪而撮其樞要也疏正義曰安何也諸家之説既互有得失何得不翦截繁多蕪穢而撮取其樞機要道也韋昭王肅先儒之領袖虞翻劉劭抑又次焉疏正義曰自此至有補將來為第四假序作注之意舉六家異同會五經旨趣敷暢經義埀益將來也吳志曰韋曜字𢎞嗣吳郡雲陽人本名昭避晉文帝諱改名曜仕吳至中書僕射侍中領左國史封高陵亭侯魏志曰王肅字子雍王朗之子仕魏歷散騎黃門侍郎散騎常侍兼太常吳志虞翻字仲翔會稽餘姚人漢末舉茂才曹公辟不就仕吳以儒學聞為老子論語國語訓注傳於世魏志劉劭字孔才廣平邯鄲人仕魏歷散騎常侍賜爵關內侯著人物志百篇此指言韋王所學在先儒之中如衣之有領袖也虞劉二家亞次之抑語辭也劉炫明安國之本陸澄譏康成之注疏正義曰隋書云劉炫字光伯河間景城人炫左畫方右畫圓口誦目數耳聽五事並舉無所遺失仕後周直門下省竟不得官縣司責其賦役炫自陳於內史乞送吏部吏部尚書韋世康問其所能炫自為狀曰周禮禮記毛詩尚書公羊左傳孝經論語孔鄭王何服杜等注凡十三家雖義有精粗並堪講授周易儀禮榖梁用功頗少子史文集嘉言美事咸誦於心天文律厯窮核微妙公私文翰未嘗舉手吏部竟不詳試除殿內將軍仕隋歷大學博士罷歸河間賊中餓死諡宣德先生初炫既得王邵所送古文孔安國注本遂著古文稽疑以明之蕭子顯齊書曰陸澄字彥淵吳郡吳人也少好學博覽無所不知起家仕宋至齊歷國子祭酒光祿大夫初澄以晉荀昶所學為非鄭玄所注請不藏祕書王儉違其議在理或當何必求人疏正義曰言但在注釋之理允當不必譏非其人也求猶責也今故特舉六家之異同會五經之旨趣疏正義曰六家即韋昭王肅虞翻劉劭劉炫陸澄也言舉此六家而又會合諸經之旨趣耳約文敷暢義則昭然疏正義曰約省也敷布也暢通也言作注之體直約省其文不假繁多能遍布通暢經義使之昭明也然辭也分注錯經理亦條貫疏正義曰謂分其注解間錯經文也經注雖然分錯其理亦不相亂而有條有貫也書云若網在綱有條而不紊論語子曰參乎吾道一以貫之是條貫之理也寫之琬琰庶有補於將來疏正義曰案考工記玉人職云琬圭九寸而繅以象德注云琬猶圜也王使之瑞節也諸侯有德王命賜之使者執琬圭以致命焉繅藉也又云琰圭九寸判規以除慝以易行注云凡圭琰上半寸琰圭琰半以上又半為瑑飾諸侯有為不義使者征之執以為瑞節也除慝誅惡逆也易行去繁苛今言以此所注孝經寫之琬圭琰圭之上若簡䇿之為庶幾有所禆補於將來學者或曰謂刋石也而言寫之琬琰者取其美名耳且夫子談經志取垂訓疏正義曰自此至序末為第五假言夫子之經言約意深注繁文不能具載仍作疏義以廣其旨也且夫子所談之經其志但取埀訓後代而已雖五孝之用則别而百行之源不殊疏正義曰五孝者天子諸侯卿大夫士庶人五等所行之孝也言此五孝之用雖尊卑不同而孝為百行之源則其致一也是以一章之中凡有數句一句之內意有兼明疏正義曰積句以成章章者明也總義包體所以明情者也句必聯字而言句者局也聯字分疆所以局言者也言夫子所修之經志在殷勤垂訓所以一章之中凡有數句一句之內意有兼明者也若移忠移順博愛廣敬之類皆是具載則文繁略之又義闕疏正義曰言作注之體意在約文敷暢復恐太略則大義或闕今存於疏用廣發揮疏正義曰此言必須作疏之義也發謂發越揮謂揮散若其注文未備者則具存於疏用此義疏以廣大發越揮散夫子之經旨也孝經序孝經序考證唐明皇御製序疏至古文孝經孔傳本出孔氏壁中許沖曰説文云古文孝經昭帝時魯國三老所獻按志云孔氏壁中古文則與尚書同出也蓋始出於武帝時至昭帝時乃獻之而曠代亡逸不被流行隋志安國之本亡於梁亂夫子沒而微言絶疏云藝文志文臣清植按此句乃劉歆移讓太常博士書中語班志蓋引用之耳濫觴於漢疏云子嬰二年春正月項羽尊楚懷王為義帝羽自立為西楚霸王更立沛公為漢王臣清植按漢書高祖本紀羽自立及立沛公皆二月事此作正月疑羽自立上脫二月兩字學開五傳疏公羊傳十一卷穀梁傳十一卷隋志春秋公羊傳十二卷梁有春秋穀梁傳十五卷卷數與漢志異分為四詩疏毛詩自夫子授卜商傳至大毛公名亨徐整云子夏授高行子高行子授薛倉子薛倉子授帛妙子帛妙子授河間大毛公一云子夏傳曾申申傳魏人李克克傳魯人孟仲子孟仲子傳根牟子根牟子傳趙人孫卿子孫卿子傳魯人大毛公孝經序考證

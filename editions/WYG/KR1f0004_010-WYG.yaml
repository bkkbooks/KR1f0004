body:
  text: 少詹事臣李清植謹言按孝經一書乃西銘理一分殊之說所自本盖孝於父母者必心父母之心而友愛於兄弟孝於天地者必心天地之心而胞與乎民物故此經曰父事天明母事地察又曰愛敬盡於事親而德教加於百姓刑於四海也注疏出於關洛之前此理未及講明是以義諦闕爾至禘為王者之大祭而注家於諸侯之祭言之其於分義所關尤大臣奉敕校勘謹詳攷古文今文及朱子刋誤本臚其同異以備叅證而注疏家有舛略者亦附而論之臣清植謹識

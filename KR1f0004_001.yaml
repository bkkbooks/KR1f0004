body:
  text: 孝經注疏卷一唐明皇御注陸德明音義宋郉昺疏開宗明義章第一疏正義曰開張也宗本也明顯也義理也言此章開張一經之宗本顯明五孝之義理故曰開宗明義章也第次也一數之始也以此章總標諸章以次結之故為第一冠諸章之首焉案孝經遭秦坑焚之後為河間顔芝所藏初除挾書之律芝子貞始出之長孫氏及江翁后蒼翼奉張禹等所説皆十八章及魯共王壞孔子宅得古文二十二章孔安國作傳劉向校經籍比量二本除其煩惑以十八章為定而不列名又有荀昶集其録及諸家疏並無章名而援神契自天子至庶人五章唯皇侃標其目而冠於章首今鄭注見章名豈先有改除後人追遠而為之也御注依古今集詳議儒官連狀題其章名重加商量遂依所請章者明也謂分析科假使理章明説文曰樂歌竟為一章章字從音從十謂從一至十十數之終諸書言章者蓋因風雅凡有科段皆謂之章焉言天子庶人雖列貴賤而立身行道無限高卑故次首章先陳天子等差其貴賤以至庶人次及三才孝治聖治三章並敘德教之所由生也紀孝行章敘孝子事親為先與五刑相因即夫孝始於事親也廣要道章廣揚名章即先王有至德要道揚名於後世也揚名之上因諫諍之臣從諫之君必有應感三者相次不離於揚名事君章即中於事君也喪親章繼於諸侯之末言孝子事親之道紀也皇侃以開宗及紀孝行喪親等三章通於貴賤今案諫諍章大夫以上皆有爭臣而士有爭友父有爭子亦該貴賤則通於貴賤者有四焉仲尼居注仲尼孔子字居謂間居曾子侍注曾子孔子弟子侍謂侍坐音義尼女持反仲尼取象尼丘山又音夷字作尼古夷字也援神契云蟲也居如字説文作凥音同鄭玄云凥凥講堂也王肅云間居也孔安國云靜而思道也曾則能反姓也子男子美稱也曾子孔子弟子也名曑字子輿魯人也或作參音同義别下皆同侍卑在尊者之側曰侍疏正義曰夫子以六經設教隨事表名雖道由孝生而孝綱未舉將欲開明其道埀之來裔以曾參之孝先有重名乃假因間居為之陳説自標己字稱仲尼居呼參為子稱曾子侍建此兩句以起師資問答之體似若别有承受而記録之注仲尼至間居正義曰云仲尼孔子字者案家語云孔子父叔梁紇娶顔氏之女徵在徵在既往廟見以夫年長懼不時有男而私禱尼丘山以祈焉孔子故名丘字仲尼夫伯仲者長幼之次也仲尼有兄字伯故曰仲其名則案桓六年左傳申繻曰名有五其三曰以類命為象杜注云若孔子首象尼丘蓋以孔子生而墟頂象尼丘山故名丘字仲尼而劉巘述張禹之義以為仲者中也尼者和也言孔子有中和之德故曰仲尼殷仲文又云夫子深敬孝道故稱表德之字至梁武帝又以丘為聚以尼為和今並不取仲尼之先殷之後也案史記殷本紀曰帝嚳之子契為堯司徒有功堯封之於商賜姓子氏契後世孫湯滅夏而為天子至湯裔孫有位無道周武王殺之封其庶兄微子啓於宋案家語及孔子世家皆云孔子其先宋人也宋閔公有子弗父何長而當立讓其弟厲公何生宋父周周生世子勝勝生正考父正考父受命為宋卿生孔父嘉嘉别為公族故其後以孔為氏或以為用乙配子或以滴溜穿石其言不經今不取也孔父嘉生木金父木金父生臯夷父臯夷父生防叔避華氏之禍而奔魯防叔生伯夏伯夏生叔梁紇紇生孔子也云居謂間居者古文孝經云仲尼間居蓋謂乘間居而坐與論語云居吾語汝義同而與下章居則致其敬不同注曾子至侍坐正義曰云曾子孔子弟子者案史記仲尼弟子傳稱曾參南武城人字子輿少孔子四十六歲孔子以為能通孝道故授之業作孝經死於魯故知是仲尼弟子也云侍謂侍坐者言侍孔子而坐也案古文云曾子侍坐故知侍謂侍坐也卑者在尊側曰侍故經謂之侍凡侍有坐有立此曾子侍即侍坐也曲禮有侍坐於先生侍坐於所尊侍坐於君子據此而言明侍坐於夫子也子曰先王有至德要道以順天下民用和睦上下無怨注孝者德之至道之要也言先代聖德之王能順天下人心行此至要之化則上下臣人和睦無怨汝知之乎曾子避席曰參不敏何足以知之注參曾子名也禮師有問避席起答敏達也言參不達何足知此至要之義子曰夫孝德之本也注人之行莫大於孝故為德本教之所由生也注言教從孝而生復坐吾語汝注曾參起對故使復坐音義子孔子也古者稱師曰子曰語辭也從乙在口上乙象氣人將發語口上有氣故曰字缺上也凡曰皆放此先王鄭玄云禹三王最先者案五帝官天下三王禹始傳於殷於殷配天故為孝教之始王謂文王也至德鄭云至德孝悌也王云孝為德之至也要因妙反注同道鄭云要道禮樂也王云孝為道之要睦音目字林云忘六反怨紆萬反敏密隕反達也夫音符下同之行下孟反復音服注同坐在卧反注同疏正義曰子者孔子自謂案公羊傳云子者男子通稱也古者謂師為子故夫子以子自稱曰者辭也言先代聖帝明王皆行至美之德要約之道以順天下人心而教化之天下之人被服其教用此之故並自相和睦上下尊卑無相怨者參汝能知之乎又假言參聞夫子之説乃避所居之席起而對曰參性不聰敏何足以知先王至德要道之言義既敘曾子不知夫子又為釋之曰夫孝德行之根本也釋先王有至德要道謂至德要道元出於孝孝為之本也云教之所生也者此釋以順天下民用和睦上下無怨謂王教由孝而生也孝道深廣非立可終故使復坐吾語汝也注孝者至無怨正義曰云孝者德之至道之要也者依王肅義德以孝而至道以孝而要是道德不離於孝殷仲文曰窮理之至以一管衆為要劉炫曰性未達何足知言性未達何足知至要之義者謂自云性未達何足知此先王至德要道之義也注人之至德本正義曰此依鄭注引其聖治章文也言孝行最大故為德之本也德則至德也注言教從孝而生正義曰此依韋注也案禮記祭義稱曽子云衆之本教曰孝尚書敬敷五教解者謂教父以義教母以慈教兄以友教弟以恭教子以孝舉此則其餘順人之教皆可知也注曾參至復坐正義曰此義已見於上身體髮膚受之父母不敢毁傷孝之始也注父母全而生之已當全而歸之故不敢毁傷立身行道揚名於後世以顯父母孝之終也注言能立身行此孝道自然名揚後世光顯其親故行孝以不毁為先揚名為後音義膚方于反毁如字蒼頡篇云毁破也廣雅云虧也疏正義曰身謂躬也體謂四支也髮謂毛髮膚謂皮膚禮運曰四體既正膚革充盈詩曰鬒髮如雲此則身體髮膚之謂也言為人子者常須戒愼戰戰兢兢恐致毁傷此孝行之始也又言孝行非唯不毁而已須成立其身使善名揚於後代以光榮其父母此孝行之終也若行孝道不至揚名榮親則未得為立身也注父母至毁傷正義曰云父母全而生之已當全而歸之者此依鄭注引祭義樂正子春之言也言子之初生受全體於父母故當常自念慮至死全而歸之若曾子啓手啓足之類是也云故不敢毁傷者毁謂虧辱傷謂損傷故夫子云不虧其體不辱其身可謂全矣及鄭注周禮禁殺戮云見血為傷是也注言能至為後正義曰云言能立身行此孝道者謂人將立其身先須行此孝道也其行孝道之事則下文始於事親中於事君是也云自然揚名後世光顯其親者皇侃云若生能行孝沒而揚名則身有德譽乃能光榮其父母也因引祭義曰孝也者國人稱願然曰幸哉有子如此又引哀公問稱孔子對曰君子也者人之成名也百姓歸之名謂之君子之子是使其親為君子也此則揚名榮親也云故行孝以不毁為先者全其身為孝子之始也云揚名為後者謂後行孝道為孝之終也夫不敢毁傷闔棺乃止立身行道弱冠須明經雖言其始終此略示有先後非謂不敢毁傷唯在於始立身獨在於終也明不敢毁傷立身行道從始至末兩行無怠此於次有先後非於事理有始終也夫孝始於事親中於事君終於立身注言行孝以事親為始事君為中忠孝道著乃能揚名榮親故曰終於立身也疏正義曰夫為人子者先能全身而後能行其道也夫行道者謂先能事親而後能立其身前言立身未示其迹其迹始者在於內事其親中者在於出事其主忠孝皆備揚名榮親是終於立身注言行至身也正義曰云言行孝以事親為始事君為中者此釋始於事親中於事君也云忠孝道著乃能揚名榮親故曰終於立身也者此釋終於立身也然能事親事君理兼士庶則終於立身此通貴賤焉鄭玄以為父母生之是事親為始四十強而仕是事君為中七十致仕是立身為終也者劉炫駮云若以始為在家終為致仕則兆庶皆能有始人君所以無終若以年七十者始為孝終不致仕者皆為不立則中壽之輩盡曰不終顔子之流亦無所立矣大雅云無念爾祖聿修厥德注詩大雅也無念念也聿述也厥其也義取恆念先祖述修其德音義大雅云此文王之詩六章文無念鄭玄云無念無忘也爾雅云勿念也聿尹吉反爾雅云循也述也疏正義曰夫子敘述立身行道揚名之義既畢乃引大雅文王之詩以結之言凡為人子孫者常念爾之先祖常述修其功德也注詩大至其德正義曰云無念念也聿述也者此並毛傳文云厥其也者釋言文云義取恆念先祖述修其德者此依孔傳也謂述修先祖之德而行之此經有十一章引詩及書劉炫云夫子敘經申述先王之道詩書之語事有當其義者則引而證之示言不虛發也七章不引者或事義相違或文勢自足則不引也五經唯傳引詩而禮則雜引詩書及易並意及則引若泛指則云詩曰詩云若指四始之名即云國風大雅小雅魯頌商頌若指篇名即言勺曰武曰皆隨所便而引之無定例也鄭注云雅者正也方始發章以正為始亦無取焉天子章第二疏正義曰前開宗明義章雖通貴賤其迹未著故此已下至於庶人凡有五章謂之五孝各説行孝奉親之事而立教焉天子至尊故標居其首案禮記表記云惟天子受命於天故曰天子白虎通云王者父天母地亦曰天子虞夏以上未有此名殷周以來始謂王者為天子也子曰愛親者不敢惡於人注博愛也敬親者不敢慢於人注廣敬也愛敬盡於事親而德教加於百姓刑於四海注刑法也君行博愛廣敬之道使人皆不慢惡其親則德教加被天下當為四夷之所法則也蓋天子之孝也注蓋猶略也孝道廣大此略言之音義子曰此一子曰通天子諸侯卿大夫士庶人五章也惡烏路反注同舊如字慢亡諫反俗作慢盡津忍反疏正義曰此陳天子之孝也所謂愛親者是天子身行愛敬也不敢惡於人不敢慢於人者是天子施化使天下之人皆行愛敬不敢慢惡於其親也親謂其父母也言天子豈唯因心內恕克己復禮自行愛敬而已亦當設教施令使天下之人不慢惡於其父母如此則至德要道之教加被天下亦當使四海蠻夷慕化而法則之此蓋是天子之行孝也孝經援神契云天子行孝曰就言德被天下澤及萬物始終成就榮其祖考也五等之孝惟於天子章稱子曰者皇侃云上陳天子極尊下列庶人極卑尊卑既異恐嫌為孝之理有别故以一子曰通冠五章明尊卑貴賤有殊而奉親之道無二注博愛也正義曰此依魏注也博大也言君愛親又施德教於人使人皆愛其親不敢有惡其父母者是博愛也注廣敬也正義曰此依魏注也廣亦大也言君敬親又施德教於人使人皆敬其親不敢有慢其父母者是廣敬也孔傳以人為天下衆人言君愛敬己親則能推己及物謂有天下者愛敬天下之人有一國者愛敬一國之人也不惡者謂君常思安人為其興利除害則上下無怨是為至德也不慢者則曲禮曰毋不敬書曰為人上者奈何不敬君能不慢於人修已以安百姓則千萬人悅是為要道也上施德教人用和睦則分崩離析無由而生也案禮記祭義稱有虞氏貴德而尚齒夏后氏貴爵而尚齒殷人貴富而尚齒周人貴親而尚齒虞夏殷周天下之盛王也未有遺年者年之貴乎天下久矣次乎事親也斯亦不敢慢於人也所以於天子章明愛敬者王肅韋昭云天子居四海之上為教訓之主為教易行故寄易行者宣之然愛之與敬解者衆多沈宏云親至結心為愛崇恪表迹為敬劉炫云愛惡俱在於心敬慢皆見於貌愛者隱惜而結於內敬者嚴肅而形於外皇侃云愛敬各有心迹蒸蒸至惜是謂愛心溫凊搔摩是謂愛迹肅肅悚悚是謂敬心拜伏擎跪是謂敬迹舊説云愛生於真敬起自嚴孝是真性故先愛後敬也舊問曰天子以愛敬為孝及庶人以躬耕為孝王者並相通否梁王答云天子既極愛敬必須五等行之然後乃成庶人雖在躬耕豈不愛敬及不驕不溢已下事邪以此言之五等之孝互相通也然諸侯言保社稷大夫言守宗廟士言保其祿位而守其祭祀以例言之天子當云保其天下庶人當言保其田農此略之不言何也左傳曰天子守在四夷故愛敬盡於事親之下而言德教加於百姓刑於四海保守之理已定不煩更言保也庶人用天之道分地之利謹身節用保守田農不離於此既無守任不假旨保守也注刑法至則也正義曰云刑法也者釋詁文云君行博愛廣敬之道使人皆不慢惡其親者是天子愛敬盡於事親又施德教使天下之人皆不敢慢惡其親也云則德教加被於天下者釋刑于四海也百姓謂天下之人皆有族姓言百舉其多也尚書云平章百姓則謂百姓為百官為下有黎民之文所以百姓非兆庶也此經德教加於百姓則謂天下百姓為與刑於四海相對四海既是四夷則此百姓自然是天下兆庶也經典通謂四夷為四海案周禮記爾雅皆言東夷西戎南蠻北狄謂之四夷或云四海故注以四夷釋四海也孫炎曰海者晦暗無知也注蓋猶至略言之正義曰此依魏注也案孔傳云蓋者辜較之辭劉炫云辜較猶梗概也孝道既廣此才舉其大略也劉巘云蓋者不終盡之辭明孝道之廣大此略言之也皇侃云略陳如此未能究竟是也鄭注云蓋者謙辭據此而言蓋非謙也劉炫駮云若以制作須謙則庶人亦當謙矣苟以名位須謙夫子曾為大夫於士何謙而亦云蓋也斯則卿士以上之言蓋者並非謙辭可知也甫刑云一人有慶兆民賴之注甫刑即尚書吕刑也一人天子也慶善也十億曰兆義取天子行孝兆人皆賴其善音義甫刑尚書作吕刑兆知從八正直表反十億曰兆民百萬曰兆民賴鹿艾反疏正義曰夫子述天子之行孝既畢乃引尚書甫刑篇之言以結成其義慶善也言天子一人有善則天下兆庶皆倚賴之也善則愛敬是也一人有慶結愛敬盡於事親已上也兆民賴之結而德教加於百姓已下也注甫刑至善正義曰云甫刑即尚書吕刑也者尚書有吕刑而無甫刑也案禮記緇衣篇孔子兩引甫刑辭與吕刑無别則孔子之代以甫刑命篇明矣今尚書為吕刑者孔安國云後為甫侯故稱甫刑知者以詩大雅嵩高之篇宣王之詩云生甫及申揚之水篇平王之詩不與我戍甫明子孫改封為甫侯不知因吕國改作甫名不知别封餘國而為甫號然子孫封甫穆王時未有甫名而稱為甫刑者後人以子孫之國號名之也猶若叔虞初封於唐子孫封晉而史記稱晉世家也劉炫以為遭秦焚書各信其學後人不能改正而兩存之也者非也諸章皆引詩此章獨引書者以孔子之言布在方䇿言必皆引詩書證事示不憑虛説義當詩意則引詩義當易意則引易此章與書意義相契故引為證也鄭注以書録王事故證天子之章以為引類得象然引大雅證大夫引曹風證聖治豈引類得象乎此不取也云一人天子也者依孔傳也舊説天子自稱則言豫一人豫我也言我雖身處上位猶是人中之一耳與人不異是謙也若臣人稱之則惟言一人言四海之內惟一人乃為尊稱也天子者帝王之爵猶公侯伯子男五等之稱云慶善也者書傳通也云十億曰兆者古數為然云義取天子行孝兆人皆賴其善者釋一人有慶兆民賴之也姓言百民稱兆皆舉其多也孝經注疏卷一孝經注疏卷一考證開宗明義章朱子刋誤本但有分章章名悉削去仲尼居古文作間居吳澄曰許慎説文所引孝經皆古文也今按説文居字下引孝經仲尼居見得當時古文居上即無間字劉炫本增此一字妄矣曾子侍古文作侍坐吳澄曰小戴記云仲尼燕居子張子貢言遊侍孔子間居子夏侍大戴記云孔子間居曾子侍並無坐字此經當為一例音義曾子名曑或作參音同義别臣清植按唐韻集韻曑音森參音驂九經字樣曰曑隸省作與參不同今經典相承多用參先王有至德要道古文先王上有參字德之本也教之所由生也古文二句各無也字吳澄曰劉炫本所減多是句末也字比今文更覺宇兀無念爾祖音義鄭玄云無念無忘也爾雅云勿念也朱子詩集傳云無念猶言豈得無念也蓋天子之孝也古文無也字甫刑疏因吕國改作甫名臣清植按蘇軾春秋列國圖説有莒無吕疑此蓋吕姓而封於甫者尚書指其姓故作吕刑他書傳指其國故作甫刑史記亦曰甫侯言於王作修刑辟孝經注疏卷一考證
